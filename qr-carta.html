<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>QR Carta — Jefe de Jefes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      background: #f2ecd5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      max-width: 380px;
      width: 90%;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .logo span { color: #dc3830; }
    .tagline {
      font-size: 0.78rem;
      color: #999;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 8px;
      border: 6px solid #272727;
    }
    .label {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #272727;
      margin-bottom: 4px;
    }
    .url {
      font-size: 0.72rem;
      color: #aaa;
      word-break: break-all;
    }
    .divider {
      width: 40px;
      height: 3px;
      background: #dc3830;
      margin: 16px auto;
      border-radius: 2px;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 28px;
      background: #dc3830;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn:hover { background: #b02e27; }
    @media print {
      body { background: white; }
      .btn { display: none; }
    }
  </style>
</head>
<body>
  <div class="card" id="printArea">
    <div class="logo">Jefe <span>de Jefes</span></div>
    <p class="tagline">Cocina Mexicana · Madrid</p>
    <div id="qrcode"></div>
    <div class="divider"></div>
    <p class="label">Escanea para ver la carta</p>
    <p class="url">jefedejefeseuropa.com/carta</p>
    <button class="btn" onclick="saveQR()">Guardar imagen</button>
  </div>

  <script>
    const qr = new QRCode(document.getElementById('qrcode'), {
      text: 'https://jefedejefeseuropa.com/carta/',
      width: 260,
      height: 260,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });

    function saveQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = 'qr-carta-jefedejefes.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        window.print();
      }
    }
  </script>
</body>
</html>
